name: AI Import Watchdog

# Fails jobs wedged in an in-flight state (worker crash / lost run) so the UI
# never shows an eternal "processing".
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required to resolve the local composite action
      - name: Trigger AI-import watchdog
        uses: ./.github/actions/call-cron
        with:
          site-url: ${{ secrets.SITE_URL }}
          path: /api/cron/ai-import-watchdog
          cron-secret: ${{ secrets.CRON_SECRET }}
