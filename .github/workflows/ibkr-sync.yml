name: IBKR Sync
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC (9 AM EDT)
    - cron: '0 20 * * *'   # 20:00 UTC (4 PM EDT)
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required to resolve the local composite action
      - name: Trigger IBKR sync
        uses: ./.github/actions/call-cron
        with:
          site-url: ${{ secrets.SITE_URL }}
          path: /api/cron/ibkr-sync
          cron-secret: ${{ secrets.CRON_SECRET }}
          # `.ok` is absent on the `{"skipped":true}` no-active-connections
          # response, so that case fails the run too — by design.
          expect: '.ok == true'
          max-time: '180'   # route polls IBKR up to ~40s, plus cold start
