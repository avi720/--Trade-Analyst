name: AI Import Cleanup

# Purges uploaded xlsx files for terminal jobs older than the retention window
# (job rows are kept as an audit trail; only the raw binary is removed).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # required to resolve the local composite action
      - name: Trigger AI-import cleanup
        uses: ./.github/actions/call-cron
        with:
          site-url: ${{ secrets.SITE_URL }}
          path: /api/cron/ai-import-cleanup
          cron-secret: ${{ secrets.CRON_SECRET }}
